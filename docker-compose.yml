services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neighborparking
      POSTGRES_USER: neighborparking
      POSTGRES_PASSWORD: neighborparking
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighborparking -d neighborparking"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://neighborparking:neighborparking@postgres:5432/neighborparking?sslmode=disable
      SESSION_TTL: 168h
      COOKIE_SECURE: "false"
      ALLOWED_ORIGIN: http://localhost:8080
      AUDIT_WORKERS: 2
      AUDIT_BUFFER: 256
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
